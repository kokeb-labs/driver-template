---
# Driver metadata (handbook KB-REPO-018): kb-core's compatibility catalogue, the MCU gate, the kb tool and the
# configurator read it. CI checks name and version against cmake/xmpl100_build_settings.cmake.
name: xmpl100
version: 0.1.0
bus: [spi]          # spi, i2c, uart, adc, pio, gpio, can, canopen, modbus, onewire
mcus: [any]         # any, or the MCU families it needs, e.g. [esp32]
peripheral: null    # an MCU peripheral it needs with mcus, e.g. rmt
kb_core_min: null   # the oldest kb-core release whose handler works with this version; null until kb-core exists
authors: ["The driver-template authors"]  # the copyright holder, as in LICENSE
hardware:           # the validation level, see the hardware-validation skill
  level: H0         # H0 host model only, H1 bench rig exercised with logs, H2 verified by a hardware engineer
  rig: null         # H1/H2: docs/bench-rig.md
  evidence: null    # H1/H2: the release asset with the bench logs
  reviewed: null    # H2: the engineer's review and the release it covers
