<svg xmlns="http://www.w3.org/2000/svg" width="456" height="343" viewBox="0 0 456 343" role="img" aria-labelledby="bus-frame-title bus-frame-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="bus-frame-title">One register read on the SPI bus</title>
<desc id="bus-frame-desc">Sequence of one SPI read frame: the host pulls CS_N low, sends the read command for TEMP_MSB, the XMPL100 answers with three bytes, and the host releases CS_N.</desc>
<defs><marker id="bus-frame-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6C7889"/></marker></defs>
<rect x="0.5" y="0.5" width="455" height="342" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="54.8" font-size="26" font-weight="700" fill="#E8EDF3">One register read on the SPI bus</text>
<rect x="32" y="70.8" width="392" height="1" fill="#252F3C"/>
<path d="M104.9 144.8 L104.9 346.8" fill="none" stroke="#6C7889" stroke-width="1.2" stroke-dasharray="5 5"/>
<path d="M351.1 144.8 L351.1 346.8" fill="none" stroke="#6C7889" stroke-width="1.2" stroke-dasharray="5 5"/>
<path d="M108.9 180.8 L347.1 180.8" fill="none" stroke="#6C7889" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bus-frame-arrow-rail)"/>
<path d="M108.9 224.8 L347.1 224.8" fill="none" stroke="#6C7889" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bus-frame-arrow-rail)"/>
<path d="M347.1 268.8 L108.9 268.8" fill="none" stroke="#6C7889" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#bus-frame-arrow-rail)"/>
<path d="M108.9 312.8 L347.1 312.8" fill="none" stroke="#6C7889" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bus-frame-arrow-rail)"/>
<rect x="39.9" y="88.8" width="130" height="52" rx="10" fill="#2E1533" stroke="#F0ABFC" stroke-width="1.4"/>
<rect x="39.9" y="96.8" width="4" height="36" rx="2" fill="#F0ABFC"/>
<rect x="286.1" y="88.8" width="130" height="52" rx="10" fill="#11281A" stroke="#4ADE80" stroke-width="1.4"/>
