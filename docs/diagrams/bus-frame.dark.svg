<text x="107.9" y="119.3" font-size="15" font-weight="700" text-anchor="middle" fill="#F5D0FE">Host</text>
<text x="354.1" y="119.3" font-size="15" font-weight="700" text-anchor="middle" fill="#BBF7D0">XMPL100</text>
<rect x="193.1" y="156.8" width="69.9" height="20" rx="10" fill="#0E131A"/>
<text x="228" y="171.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">CS_N low</text>
<rect x="147.9" y="200.8" width="160.3" height="20" rx="10" fill="#0E131A"/>
<text x="228" y="215.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">0x85 (read, TEMP_MSB)</text>
<rect x="112.9" y="244.8" width="230.2" height="20" rx="10" fill="#0E131A"/>
<text x="228" y="259.1" font-size="12" font-weight="500" text-anchor="middle" fill="#9AA6B5">TEMP_MSB, TEMP_LSB, TEMP_CRC</text>
