<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="752" viewBox="0 0 1200 752" role="img" aria-labelledby="chip-frame-spi-title chip-frame-spi-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-frame-spi-title">XMPL100: SPI register access</title>
<desc id="chip-frame-spi-desc">SPI register access of the XMPL100, 16 bits, most significant bit first. Write: R/W (bit 15), address (bits 14 to 8), data (bits 7 to 0); Read: R/W (bit 15), address (bits 14 to 8), any value (bits 7 to 0); Reply: ignored (bits 15 to 8), register data (bits 7 to 0). Below, the SPI mode 0 waveform of one transfer in the same bit grid.</desc>
<rect x="0.5" y="0.5" width="1199" height="751" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#F8D27A">ON THE BUS</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#E8EDF3">XMPL100: SPI register access</text>
<text x="32" y="115.4" font-size="18" fill="#9AA6B5">One register per access; a burst continues with the next address. 16 bits, sent most significant bit first. Datasheet: 6.2 SPI</text>
<text x="32" y="141.5" font-size="18" fill="#9AA6B5">interface, p. 8.</text>
