<text x="32" y="682.3" font-size="16" fill="#9AA6B5">SPI mode 0: SCLK idles low; the chip samples its input on the rising edge and changes its output after the falling edge. CS_N stays low for the</text>
<text x="32" y="705.5" font-size="16" fill="#9AA6B5">whole frame.</text>
