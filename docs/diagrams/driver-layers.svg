<text x="56" y="639.4" font-size="20" font-weight="700" fill="#115E59">Platform port (your class)</text>
<text x="56" y="668.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">EnsureInitialized()  Transfer()</text>
