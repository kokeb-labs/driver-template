<path d="M430 673.6 L430 729.6" fill="none" stroke="#8893A2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<path d="M430 825.6 L430 881.6" fill="none" stroke="#8893A2" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#fk-arrow-rail)"/>
<rect x="32" y="149.4" width="796" height="89" rx="12" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<rect x="32" y="157.4" width="4" height="73" rx="2" fill="#0B7A72"/>
<rect x="32" y="580.6" width="796" height="89" rx="12" fill="#FBEFE6" stroke="#9A4A17" stroke-width="1.4"/>
<rect x="32" y="588.6" width="4" height="73" rx="2" fill="#9A4A17"/>
<rect x="32" y="733.6" width="796" height="88" rx="12" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<rect x="32" y="741.6" width="4" height="72" rx="2" fill="#0B7A72"/>
<rect x="32" y="885.6" width="796" height="89" rx="12" fill="#F1F4F8" stroke="#64748B" stroke-width="1.4"/>
<rect x="32" y="893.6" width="4" height="73" rx="2" fill="#64748B"/>
<rect x="868" y="302.4" width="300" height="128.3" rx="12" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<rect x="868" y="733.6" width="300" height="103.6" rx="12" fill="#E6F6F4" stroke="#A6DCD5" stroke-width="1"/>
<text x="56" y="184.4" font-size="20" font-weight="700" fill="#0B5F59">Your application</text>
<text x="56" y="215" font-size="17" fill="#2B3442">a handler, a manager or a test</text>
<rect x="48" y="370.6" width="98.4" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="56" y="388.7" font-size="16" font-weight="700" fill="#7A360E">Initialize()</text>
<rect x="154.4" y="370.6" width="167" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="162.4" y="388.7" font-size="16" font-weight="700" fill="#7A360E">EnsureInitialized()</text>
<rect x="329.4" y="370.6" width="120.6" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="337.4" y="388.7" font-size="16" font-weight="700" fill="#7A360E">Deinitialize()</text>
<rect x="457.9" y="370.6" width="110.3" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="465.9" y="388.7" font-size="16" font-weight="700" fill="#7A360E">SoftReset()</text>
<rect x="576.2" y="370.6" width="157.2" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="584.2" y="388.7" font-size="16" font-weight="700" fill="#7A360E">HardwareReset()</text>
<rect x="48" y="404.6" width="133.2" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="56" y="422.7" font-size="16" font-weight="700" fill="#7A360E">ApplyConfig()</text>
<rect x="189.2" y="404.6" width="103.2" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="197.2" y="422.7" font-size="16" font-weight="700" fill="#7A360E">SetMode()</text>
<rect x="300.4" y="404.6" width="203.4" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="308.4" y="422.7" font-size="16" font-weight="700" fill="#7A360E">SetAlertThresholdsC()</text>
<rect x="511.8" y="404.6" width="124" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="519.8" y="422.7" font-size="16" font-weight="700" fill="#7A360E">ReadStatus()</text>
<rect x="48" y="438.6" width="214.2" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="56" y="456.7" font-size="16" font-weight="700" fill="#7A360E">ReadRawTemperature()</text>
<rect x="270.2" y="438.6" width="191.3" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="278.2" y="456.7" font-size="16" font-weight="700" fill="#7A360E">ReadTemperatureC()</text>
<rect x="469.5" y="438.6" width="162.1" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="477.5" y="456.7" font-size="16" font-weight="700" fill="#7A360E">TriggerOneShot()</text>
<rect x="639.6" y="438.6" width="157.2" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="647.6" y="456.7" font-size="16" font-weight="700" fill="#7A360E">WaitDataReady()</text>
<rect x="48" y="472.6" width="157.9" height="26" rx="13" fill="#FBEFE6" stroke="#E9C3A6" stroke-width="1"/>
<text x="56" y="490.7" font-size="16" font-weight="700" fill="#7A360E">MeasureOnceC()</text>
<text x="48" y="331.4" font-size="17" font-weight="700" fill="#7A360E">HARDWARE-AGNOSTIC CORE</text>
<text x="48" y="354.6" font-size="16" fill="#7A360E">XMPL100, inc/xmpl100.hpp</text>
<rect x="405.4" y="258.4" width="49.1" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="276.2" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">calls</text>
<text x="56" y="615.6" font-size="20" font-weight="700" fill="#7A360E">Port contract</text>
<text x="56" y="646.2" font-size="17" fill="#2B3442">SpiInterface&lt;YourPort&gt;: checked at compile time, no virtual calls</text>
<text x="56" y="768.6" font-size="20" font-weight="700" fill="#0B5F59">Your port</text>
<text x="56" y="797.8" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#2B3442">EnsureInitialized()  Transfer()</text>
<text x="56" y="920.6" font-size="20" font-weight="700" fill="#334155">XMPL100</text>
<text x="56" y="951.2" font-size="17" fill="#2B3442">the chip, on the SPI bus</text>
<rect x="322.9" y="536.6" width="214.1" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="554.4" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">register reads and writes</text>
<rect x="329.6" y="689.6" width="200.8" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="707.4" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">forwards to your hooks</text>
<rect x="371.8" y="841.6" width="116.4" height="24" rx="12" fill="#FFFFFF"/>
<text x="430" y="859.4" font-size="16" font-weight="500" text-anchor="middle" fill="#566070">SPI transfers</text>
<text x="886" y="337.4" font-size="20" font-weight="700" fill="#7A360E">Shared</text>
<text x="886" y="360.8" font-size="17" fill="#7A360E">The core and the contract are</text>
<text x="886" y="385.5" font-size="17" fill="#7A360E">the same code on every MCU</text>
<text x="886" y="410.1" font-size="17" fill="#7A360E">and on the host.</text>
<text x="886" y="768.6" font-size="20" font-weight="700" fill="#0B5F59">Yours</text>
<text x="886" y="792.1" font-size="17" fill="#0B5F59">One small class per MCU or</text>
<text x="886" y="816.7" font-size="17" fill="#0B5F59">board.</text>
<rect x="32" y="987" width="14" height="14" rx="4" fill="#E6F6F4" stroke="#0B7A72" stroke-width="1.4"/>
<text x="54" y="1001.6" font-size="16" fill="#566070">you write</text>
<rect x="152.3" y="987" width="14" height="14" rx="4" fill="#FBEFE6" stroke="#9A4A17" stroke-width="1.4"/>
<text x="174.3" y="1001.6" font-size="16" fill="#566070">this library</text>
<rect x="282.1" y="987" width="14" height="14" rx="4" fill="#F1F4F8" stroke="#64748B" stroke-width="1.4"/>
<text x="304.1" y="1001.6" font-size="16" fill="#566070">hardware</text>
<path d="M404.1 995L434.1 995" fill="none" stroke="#8893A2" stroke-width="2.2" marker-end="url(#fk-arrow-rail)"/>
<text x="448.1" y="1001.6" font-size="16" fill="#566070">calls</text>
</svg>
