<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#3730A3">ARCHITECTURE</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#0E1726">The layers, one of them yours</text>
<text x="32" y="115.4" font-size="18" fill="#566070">The core and the contract are the same on every MCU. The port is a small class you write.</text>
<rect x="32" y="131.4" width="1136" height="1" fill="#E2E7EE"/>
