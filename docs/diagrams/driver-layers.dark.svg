<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="884" viewBox="0 0 1200 884" role="img" aria-labelledby="driver-layers-title driver-layers-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="driver-layers-title">The layers, one of them yours</title>
<desc id="driver-layers-desc">Layer diagram: the application calls the hardware-agnostic XMPL100 core, which uses the CRTP SPI port contract, which calls the platform port you write, which drives the chip.</desc>
<defs><marker id="fk-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#6C7889"/></marker></defs>
<rect x="0.5" y="0.5" width="1199" height="883" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="46.8" font-size="16" font-weight="700" letter-spacing="1.2" fill="#C7CBFF">ARCHITECTURE</text>
<text x="32" y="85.6" font-size="32" font-weight="700" fill="#E8EDF3">The layers, one of them yours</text>
<text x="32" y="115.4" font-size="18" fill="#9AA6B5">The core and the contract are the same on every MCU. The port is a small class you write.</text>
<rect x="32" y="131.4" width="1136" height="1" fill="#252F3C"/>
