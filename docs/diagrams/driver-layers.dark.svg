<text x="56" y="639.4" font-size="20" font-weight="700" fill="#A7F3E6">Platform port (your class)</text>
<text x="56" y="668.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">EnsureInitialized()  Transfer()</text>
<text x="56" y="767.4" font-size="20" font-weight="700" fill="#E8EDF3">XMPL100</text>
<text x="56" y="798" font-size="17" fill="#D2DAE4">SPI bus</text>
