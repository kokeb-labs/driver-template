<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="745" viewBox="0 0 1200 745" role="img" aria-labelledby="chip-hero-title chip-hero-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-hero-title">XMPL100</title>
<desc id="chip-hero-desc">Overview of the XMPL100, a digital temperature sensor that measures its own die from -40 °C to +125 °C in steps of 1/128 °C and pulls an alert line low when the temperature leaves a window you set. A MCU talks to it over SPI; it drives ALERT line; it reads back Die temperature. Headline figures: -40 to +125 °C measurement range; 1/128 °C resolution of the 16-bit result; 10 MHz SPI clock, mode 0 or 3; 1.8 to 3.6 V supply.</desc>
