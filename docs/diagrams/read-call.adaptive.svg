<svg xmlns="http://www.w3.org/2000/svg" width="626" height="535" viewBox="0 0 626 535" role="img" aria-labelledby="read-call-title read-call-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="read-call-title">One call through the layers</title>
<desc id="read-call-desc">Sequence of one temperature read: your code calls the XMPL100 core, which reads STATUS and then the three temperature bytes through your port, checks the CRC and returns a Result.</desc>
