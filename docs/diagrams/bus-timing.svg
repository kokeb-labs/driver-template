<title id="bus-timing-title">SPI timing of one byte</title>
<desc id="bus-timing-desc">SPI timing of the XMPL100 in mode 0: CS_N low frames the transfer, SDI is read on each rising SCLK edge and SDO changes on each falling edge for one byte, with the select, setup and hold times of the datasheet.</desc>
