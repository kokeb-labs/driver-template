<svg xmlns="http://www.w3.org/2000/svg" width="456" height="343" viewBox="0 0 456 343" role="img" aria-labelledby="bus-frame-title bus-frame-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="bus-frame-title">One register read on the SPI bus</title>
<desc id="bus-frame-desc">Sequence of one SPI read frame: the host pulls CS_N low, sends the read command for TEMP_MSB, the XMPL100 answers with three bytes, and the host releases CS_N.</desc>
<defs><marker id="bus-frame-arrow-rail" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#7C8798"/></marker></defs>
<rect x="0.5" y="0.5" width="455" height="342" rx="16" fill="#FFFFFF" stroke="#E2E7EE"/>
<text x="32" y="54.8" font-size="26" font-weight="700" fill="#0E1726">One register read on the SPI bus</text>
<rect x="32" y="70.8" width="392" height="1" fill="#E2E7EE"/>
<path d="M104.9 144.8 L104.9 346.8" fill="none" stroke="#738093" stroke-width="1.2" stroke-dasharray="5 5"/>
<path d="M351.1 144.8 L351.1 346.8" fill="none" stroke="#738093" stroke-width="1.2" stroke-dasharray="5 5"/>
<path d="M108.9 180.8 L347.1 180.8" fill="none" stroke="#7C8798" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bus-frame-arrow-rail)"/>
<path d="M108.9 224.8 L347.1 224.8" fill="none" stroke="#7C8798" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bus-frame-arrow-rail)"/>
<path d="M347.1 268.8 L108.9 268.8" fill="none" stroke="#7C8798" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="7 5" marker-end="url(#bus-frame-arrow-rail)"/>
<path d="M108.9 312.8 L347.1 312.8" fill="none" stroke="#7C8798" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" marker-end="url(#bus-frame-arrow-rail)"/>
<rect x="39.9" y="88.8" width="130" height="52" rx="10" fill="#FDF0FF" stroke="#A21CAF" stroke-width="1.4"/>
<rect x="39.9" y="96.8" width="4" height="36" rx="2" fill="#A21CAF"/>
<rect x="286.1" y="88.8" width="130" height="52" rx="10" fill="#EAF7EF" stroke="#15803D" stroke-width="1.4"/>
<rect x="286.1" y="96.8" width="4" height="36" rx="2" fill="#15803D"/>
<text x="107.9" y="119.3" font-size="15" font-weight="700" text-anchor="middle" fill="#86198F">Host</text>
<text x="354.1" y="119.3" font-size="15" font-weight="700" text-anchor="middle" fill="#14532D">XMPL100</text>
<rect x="193.1" y="156.8" width="69.9" height="20" rx="10" fill="#FFFFFF"/>
<text x="228" y="171.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">CS_N low</text>
<rect x="147.9" y="200.8" width="160.3" height="20" rx="10" fill="#FFFFFF"/>
<text x="228" y="215.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">0x85 (read, TEMP_MSB)</text>
<rect x="112.9" y="244.8" width="230.2" height="20" rx="10" fill="#FFFFFF"/>
<text x="228" y="259.1" font-size="12" font-weight="500" text-anchor="middle" fill="#566070">TEMP_MSB, TEMP_LSB, TEMP_CRC</text>
<rect x="190.6" y="288.8" width="74.8" height="20" rx="10" fill="#FFFFFF"/>
