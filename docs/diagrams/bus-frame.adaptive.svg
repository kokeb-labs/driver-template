<svg xmlns="http://www.w3.org/2000/svg" width="456" height="343" viewBox="0 0 456 343" role="img" aria-labelledby="bus-frame-title bus-frame-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" class="fk">
<title id="bus-frame-title">One register read on the SPI bus</title>
<desc id="bus-frame-desc">Sequence of one SPI read frame: the host pulls CS_N low, sends the read command for TEMP_MSB, the XMPL100 answers with three bytes, and the host releases CS_N.</desc>
