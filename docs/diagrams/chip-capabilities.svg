<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="673" viewBox="0 0 1200 673" role="img" aria-labelledby="chip-capabilities-title chip-capabilities-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-capabilities-title">What the XMPL100 does</title>
<desc id="chip-capabilities-desc">Capability map of the XMPL100: Temperature (supported): Measures the die temperature as a 16-bit result, 1/128 °C per count; Continuous and one-shot (supported): Converts continuously at a chosen rate, or once on request to save power; Alert window (supported): Pulls the open-drain ALERT pin low outside a high and a low threshold; Result CRC (supported): Protects each result with a CRC-8 on revision B silicon; Offset trim (supported): Shifts every result by a signed offset, 1/16 °C per count; Reset and identity (supported): Soft or hardware reset, then a chip ID and revision check before anything else.</desc>
