<text x="32" y="85.6" font-size="32" font-weight="700" fill="#0E1726">What the XMPL100 does</text>
<text x="32" y="115.4" font-size="18" fill="#566070">One card per function of the chip, with how this driver covers it and the registers behind it.</text>
