<svg xmlns="http://www.w3.org/2000/svg" width="840" height="626" viewBox="0 0 840 626" role="img" aria-labelledby="chip-circuit-typical-title chip-circuit-typical-desc" font-family="Inter, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif">
<title id="chip-circuit-typical-title">XMPL100: Typical application</title>
<desc id="chip-circuit-typical-desc">Schematic of the XMPL100 typical application: the chip with U2 MCU, C1 capacitor 100 nF, R1 resistor 10 kΩ; the MCU wires carry the port hooks GpioSet(CtrlPin::Reset), Transfer().</desc>
<rect x="0.5" y="0.5" width="839" height="625" rx="16" fill="#0E131A" stroke="#283241"/>
<text x="32" y="44" font-size="12.5" font-weight="700" letter-spacing="1.2" fill="#F8D27A">HARDWARE</text>
<text x="32" y="77.3" font-size="26" font-weight="700" fill="#E8EDF3">XMPL100: Typical application</text>
<text x="32" y="103.8" font-size="15" fill="#9AA6B5">The XMPL100 on an MCU's SPI bus, with RESET_N on a GPIO the driver drives through GpioSet() and</text>
<text x="32" y="125.5" font-size="15" fill="#9AA6B5">ALERT on an interrupt input. Above each MCU wire: the port hook that drives it. Datasheet: 9</text>
<text x="32" y="147.3" font-size="15" fill="#9AA6B5">Application information, p. 20.</text>
