name: Bug report
description: Something builds wrong, behaves wrong, or crashes.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Security problems go through a private security advisory, not an issue. See SECURITY.md.
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you saw, including error messages or log output.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Commands, configuration, and minimal code if possible.
      placeholder: |
        1. ./scripts/build_app.sh <app> Debug release/v5.5
        2. Flash and run ...
        3. ...
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Tag or commit SHA of this repo (and of the parent repo if it is used as a submodule).
    validations:
      required: true
  - type: dropdown
    id: target
    attributes:
      label: Target
      options:
        - Vortex V1
        - Flux V1
        - ESP32 dev kit
        - Host (tests or simulation)
        - Other
    validations:
      required: true
  - type: input
    id: toolchain
    attributes:
      label: Toolchain
      description: ESP-IDF version, compiler, host OS.
      placeholder: ESP-IDF v5.5, macOS 15
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Serial output, CI log excerpt or backtrace.
      render: text
