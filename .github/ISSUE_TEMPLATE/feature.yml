name: Feature request
description: A new capability, chip variant, board or API change.
labels: ["enhancement"]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What you are trying to do and why the current code does not cover it.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed change
      description: What you would like added or changed. Include API sketches if you have them.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
  - type: dropdown
    id: layer
    attributes:
      label: Layer
      description: Where you expect the change to live.
      options:
        - Driver
        - A library this driver uses
        - The consumer (board support or application)
        - CI or tooling
        - Documentation
        - Not sure
    validations:
      required: true
  - type: textarea
    id: references
    attributes:
      label: References
      description: Datasheet sections, application notes, related issues or PRs.
