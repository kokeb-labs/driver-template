---
name: Host quality

# Complexity, coverage, sanitizer and fuzz gates at this repository's assurance level (handbook ADR-0020).
on:
  workflow_call:

permissions:
  contents: read

jobs:
  quality:
    name: Quality gates
    uses: kokeb-labs/ci-tools/.github/workflows/ru-host-quality.yml@v1
    permissions:
      contents: read
    with:
      level: high
      cmake_args: "-DXMPL100_BUILD_TESTS=ON"
      # scaffold:fuzz-args
      fuzz_cmake_args: "-DXMPL100_BUILD_FUZZERS=ON"
      # /scaffold:fuzz-args
      library_paths: "inc src"
