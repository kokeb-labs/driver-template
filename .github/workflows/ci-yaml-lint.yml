---
name: YAML lint

on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  yamllint:
    name: YAML lint
    uses: kokeb-labs/ci-tools/.github/workflows/ru-yaml-lint.yml@v1
    with:
      paths: '.github/workflows/*.yml,**/*.yml,**/*.yaml'
      config_file: '_config/.yamllint'
      strict_mode: false
      exclude_patterns: >-
        .git/**,node_modules/**,venv/**,.venv/**,_site/**,**/espidf-tools/**,examples/esp32/scripts/**
