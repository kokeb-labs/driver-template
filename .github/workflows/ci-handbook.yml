---
name: Handbook check

# The handbook rules a script can decide, against .kokeb/handbook.yml (kind, level, waivers), reported by rule ID.
on:
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  handbook:
    name: Handbook rules
    uses: kokeb-labs/ci-tools/.github/workflows/ru-handbook-check.yml@v1
    permissions:
      contents: read
